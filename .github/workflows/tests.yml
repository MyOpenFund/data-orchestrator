name: tests

on:
  push:
    branches: [main]
  pull_request:

jobs:
  unit:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        # 3.13 is what production runs (and what the integration job uses).
        python-version: ["3.12", "3.13"]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip
          cache-dependency-path: pyproject.toml
      # The CPU build of PyTorch first: the default wheel carries the CUDA libraries.
      # The engine (rag-engine, pinned by commit in pyproject.toml) then comes
      # with the package itself.
      - name: Install
        run: |
          pip install torch --index-url https://download.pytorch.org/whl/cpu
          pip install -e ".[dev]"
      # Compares the commit pip recorded for rag-engine (direct_url.json) with
      # the sha in pyproject.toml; fails on any difference.
      - name: The engine installed is the pinned commit
        run: python tools/check_engine_pin.py
      - name: Versions of the libraries that decide text and vectors
        run: pip freeze | grep -i -E "^(chunknorris|pymupdf|sentence-transformers|torch|transformers|rag-engine|qdrant-client)\b"
      - name: Unit tests
        run: pytest -q

  integration:
    runs-on: ubuntu-latest
    env:
      DATA_ORCHESTRATOR_EMBEDDING_MODEL: sentence-transformers/paraphrase-albert-small-v2
      # Any model but the default must declare its dimension (README, "Configuration").
      DATA_ORCHESTRATOR_EMBEDDING_DIM: "768"
    steps:
      - uses: actions/checkout@v4
      # The version production runs: the dependencies resolved are then the
      # ones production has (chunknorris 1.5.0; Python 3.12 resolved 1.4.0).
      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"
          cache: pip
          cache-dependency-path: pyproject.toml
      - name: Cache the tiny embedding model
        uses: actions/cache@v4
        with:
          path: ~/.cache/huggingface
          key: hf-${{ env.DATA_ORCHESTRATOR_EMBEDDING_MODEL }}
      - name: Install
        run: |
          pip install torch --index-url https://download.pytorch.org/whl/cpu
          pip install -e ".[dev]"
      - name: The engine installed is the pinned commit
        run: python tools/check_engine_pin.py
      - name: Integration tests (throwaway postgres + qdrant)
        run: pytest -m integration -q

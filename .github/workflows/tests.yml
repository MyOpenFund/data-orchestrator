name: tests

on:
  push:
    branches: [main]
  pull_request:

jobs:
  unit:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/checkout@v4
        with:
          repository: MyOpenFund/eigenmind
          # Pinned by commit: upstream rewrote its history on 2026-11-08; bump
          # together with routing.MIME_EXTENSIONS (README "Testing").
          ref: 6e9093a777d059aefac5340de51c2c77fc93dec7
          path: eigenmind
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - name: Install
        run: |
          pip install -e ./eigenmind
          pip install -e ".[dev]"
      - name: Unit tests
        run: pytest -q

  integration:
    runs-on: ubuntu-latest
    env:
      DATA_ORCHESTRATOR_EMBEDDING_MODEL: sentence-transformers/paraphrase-albert-small-v2
    steps:
      - uses: actions/checkout@v4
      - uses: actions/checkout@v4
        with:
          repository: MyOpenFund/eigenmind
          # Pinned by commit: upstream rewrote its history on 2026-11-08; bump
          # together with routing.MIME_EXTENSIONS (README "Testing").
          ref: 6e9093a777d059aefac5340de51c2c77fc93dec7
          path: eigenmind
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - name: Cache the tiny embedding model
        uses: actions/cache@v4
        with:
          path: ~/.cache/huggingface
          key: hf-${{ env.DATA_ORCHESTRATOR_EMBEDDING_MODEL }}
      - name: Install
        run: |
          pip install -e ./eigenmind
          pip install -e ".[dev]"
      - name: Integration tests (throwaway postgres + qdrant)
        run: pytest -m integration -q

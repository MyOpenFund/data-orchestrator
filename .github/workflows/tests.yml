name: tests

on:
  push:
    branches: [main]
  pull_request:

jobs:
  unit:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: pyproject.toml
      # The CPU build of PyTorch first: the default wheel carries the CUDA libraries.
      # The engine (rag-engine, pinned by commit in pyproject.toml) then comes
      # with the package itself.
      - name: Install
        run: |
          pip install torch --index-url https://download.pytorch.org/whl/cpu
          pip install -e ".[dev]"
      - name: The engine installed is the pinned one
        run: python -c "import rag_engine, chunknorris, sentence_transformers, torch; print(rag_engine.__version__, torch.__version__)"
      - name: Unit tests
        run: pytest -q

  integration:
    runs-on: ubuntu-latest
    env:
      DATA_ORCHESTRATOR_EMBEDDING_MODEL: sentence-transformers/paraphrase-albert-small-v2
      # Any model but the default must declare its dimension (README, "Configuration").
      DATA_ORCHESTRATOR_EMBEDDING_DIM: "768"
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: pyproject.toml
      - name: Cache the tiny embedding model
        uses: actions/cache@v4
        with:
          path: ~/.cache/huggingface
          key: hf-${{ env.DATA_ORCHESTRATOR_EMBEDDING_MODEL }}
      - name: Install
        run: |
          pip install torch --index-url https://download.pytorch.org/whl/cpu
          pip install -e ".[dev]"
      - name: Integration tests (throwaway postgres + qdrant)
        run: pytest -m integration -q

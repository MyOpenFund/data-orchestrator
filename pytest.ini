[pytest]
# Collect only this repo's suite: in CI the eigenmind fork is checked out
# inside the workspace and its tests/ must not be swept up by collection.
testpaths = tests
markers =
    integration: requires docker (throwaway postgres + qdrant containers)
# -p pytester: the env-isolation guard in tests/test_env_isolation.py runs a
# throwaway pytest session to prove the isolation fixture's teardown ordering.
addopts = -m "not integration" -p pytester
# pymupdf's SWIG bindings (imported through eigenmind) warn on import with
# every Python >= 3.12. Third-party, nothing this repo can fix, and it is the
# only thing standing between this suite and a pristine run. Matched narrowly
# on the message so any other DeprecationWarning still shows up.
filterwarnings =
    ignore:builtin type [Ss]wig.*:DeprecationWarning

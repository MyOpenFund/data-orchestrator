[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "rag-orchestrator"
version = "0.1.0"
description = "Ingestion orchestrator: vault-selected documents through the eigenmind engine into Qdrant."
readme = "README.md"
requires-python = ">=3.10"
license = { text = "MIT" }
authors = [{ name = "jeulinmarc", email = "jeulinmarc@gmail.com" }]
keywords = ["rag", "ingestion", "qdrant", "embeddings", "central-bank"]

# NOTE on the eigenmind dependency
# --------------------------------
# The ingestion engine is our eigenmind fork (github.com/jeulinmarc/eigenmind),
# installed separately as an editable checkout because it is consumed at
# fork-HEAD, not from PyPI:
#     pip install -e $EIGENMIND_PATH
# (EIGENMIND_PATH lives in .env; see .env.example.) It provides chunknorris,
# sentence-transformers, torch and qdrant-client transitively.
dependencies = [
    "psycopg2-binary>=2.9",
]

[project.optional-dependencies]
# Streamlit dashboard (corpus vs RAG tracking, as-of date, query/graph logs).
dashboard = ["streamlit>=1.40", "pandas>=2.0"]
dev = ["pytest>=8.0"]

[project.scripts]
rag-orchestrator = "rag_orchestrator.cli:main"
rag-dashboard = "rag_orchestrator.dashboard.__main__:main"

[tool.setuptools.packages.find]
include = ["rag_orchestrator*"]

[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "data-orchestrator"
version = "0.1.0"
description = "Ingestion orchestrator: vault-selected documents through the eigenmind engine into Qdrant."
readme = "README.md"
requires-python = ">=3.10"
license = { text = "MIT" }
authors = [{ name = "jeulinmarc", email = "jeulinmarc@gmail.com" }]
keywords = ["rag", "ingestion", "qdrant", "embeddings", "central-bank"]

# NOTE on the eigenmind dependency
# --------------------------------
# The ingestion engine is our eigenmind fork (github.com/MyOpenFund/eigenmind),
# installed separately as an editable checkout because it is consumed at
# fork-HEAD, not from PyPI:
#     pip install -e $EIGENMIND_PATH
# (EIGENMIND_PATH lives in .env; see .env.example.) It provides chunknorris,
# sentence-transformers, torch and qdrant-client transitively.
dependencies = [
    "psycopg2-binary>=2.9",
]

[project.optional-dependencies]
# company_corpus source connector (SEC EDGAR micro layer). Pulled from GitHub
# rather than vendored: it owns all discovery/download/render logic and exposes
# `company_corpus.rag.iter_items`. Heavy + has its own system needs (Chrome for
# PDF rendering), hence an opt-in extra. Equivalent to a local checkout installed
# with `pip install -e .`, or simply put on PYTHONPATH.
company = [
    "company-corpus @ git+https://github.com/MyOpenFund/company-corpus",
]
dev = ["pytest>=8.0", "pytest-cov>=5.0"]

[project.scripts]
data-orchestrator = "data_orchestrator.cli:main"

[tool.setuptools.packages.find]
include = ["data_orchestrator*"]

[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "data-orchestrator"
version = "0.1.0"
description = "Ingestion orchestrator: vault-selected documents through the rag-engine library into Qdrant."
readme = "README.md"
requires-python = ">=3.10"
license = { text = "MIT" }
authors = [{ name = "jeulinmarc", email = "jeulinmarc@gmail.com" }]
keywords = ["rag", "ingestion", "qdrant", "embeddings", "central-bank"]

# The ingestion engine is rag-engine (github.com/MyOpenFund/rag-engine), pinned
# by commit: the engine decides point ids, payloads and where documents are
# cut, so a new commit is taken on purpose, with tests/test_engine_parity.py
# and tests/test_routing.py (supported extensions) as the guards. Its `ingest`
# extra brings the parsers (chunknorris, markitdown), its `torch` extra the
# embedding backend (sentence-transformers, torch); qdrant-client comes with
# the base package. On a machine without a GPU, install the CPU build of
# PyTorch first (README, "Installation"): the default wheel carries CUDA.
dependencies = [
    "psycopg2-binary>=2.9",
    "rag-engine[ingest,torch] @ git+https://github.com/MyOpenFund/rag-engine@fbbe09b789828a67c28beadca1f2a95d611158a8",
]

[project.optional-dependencies]
# company_corpus source connector (SEC EDGAR micro layer). Pulled from GitHub
# rather than vendored: it owns all discovery/download/render logic and exposes
# `company_corpus.rag.iter_items`. Heavy + has its own system needs (Chrome for
# PDF rendering), hence an opt-in extra. Equivalent to a local checkout installed
# with `pip install -e .`, or simply put on PYTHONPATH.
company = [
    "company-corpus @ git+https://github.com/MyOpenFund/company-corpus",
]
dev = ["pytest>=8.0", "pytest-cov>=5.0"]

[project.scripts]
data-orchestrator = "data_orchestrator.cli:main"

[tool.setuptools.packages.find]
include = ["data_orchestrator*"]
